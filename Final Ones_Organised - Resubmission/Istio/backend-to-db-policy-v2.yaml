apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-backend-to-db
  namespace: jenkins
spec:
  selector:
    matchLabels:
      app: my-app-db  # Target the database
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - spiffe://cluster.local/ns/jenkins/sa/backend-sa  # SPIFFE ID of backend-sa
    to:
    - operation:
        ports: ["3306"]  # MySQL port
