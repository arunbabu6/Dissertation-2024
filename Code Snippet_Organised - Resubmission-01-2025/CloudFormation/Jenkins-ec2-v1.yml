AWSTemplateFormatVersion: "2010-09-09"
Description: "Create a Jenkins EC2 instance with a new subnet under the same VPC"

Parameters:
  VpcId:
    Type: String
    Default: "vpc-00e846809741627f0"
    Description: "VPC ID for Jenkins and Kubernetes communication"

  SubnetsPublic:
    Type: String
    Default: "subnet-009b43878e66ee3ac,subnet-03caa04f529932c0a,subnet-03ab484d8583d16e4"
    Description: "Comma-separated list of public subnets"

  ControlPlaneSecurityGroupId:
    Type: String
    Default: "sg-010d3efb9c7a78cd2"
    Description: "Security group ID of the EKS control plane"

  ClusterSecurityGroupId:
    Type: String
    Default: "sg-036cf7a512812db8b"
    Description: "Shared security group for EKS cluster"

  SharedNodeSecurityGroupId:
    Type: String
    Default: "sg-05e581c95c5aeedcb"
    Description: "Shared security group for EKS nodes"

  KeyName:
    Type: String
    Default: "ec2"
    Description: "Key pair for Jenkins EC2 instance"

  InstanceType:
    Type: String
    Default: "t3.medium"
    AllowedValues:
      - t2.micro
      - t3.micro
      - t3.medium
      - t3.large
    Description: "EC2 instance type for Jenkins"

  JenkinsSubnetCidr:
    Type: String
    Default: "192.168.96.0/24"
    Description: "CIDR block for the new Jenkins subnet"

Resources:
  JenkinsSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref JenkinsSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: "JenkinsSubnet"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: "PublicRouteTable"

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !ImportValue "my-cluster::InternetGatewayId"

  JenkinsRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref JenkinsSubnet

  JenkinsInstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for Jenkins EC2 instance"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0  # SSH Access - Restrict if needed
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0  # Jenkins Web UI Access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0  # Full outbound access
      Tags:
        - Key: Name
          Value: "JenkinsSecurityGroup"

  UpdateControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ControlPlaneSecurityGroupId
      IpProtocol: -1
      SourceSecurityGroupId: !Ref JenkinsInstanceSecurityGroup

  UpdateSharedNodeSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SharedNodeSecurityGroupId
      IpProtocol: -1
      SourceSecurityGroupId: !Ref JenkinsInstanceSecurityGroup

  UpdateClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroupId
      IpProtocol: -1
      SourceSecurityGroupId: !Ref JenkinsInstanceSecurityGroup

  JenkinsInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref JenkinsSubnet
      SecurityGroupIds:
        - !Ref JenkinsInstanceSecurityGroup
      ImageId: ami-0caf77f9b87412c51
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -x
          # Update system and install necessary dependencies
          yum update -y
          amazon-linux-extras enable corretto8
          yum install -y java-1.8.0-openjdk git docker
          yum install -y kubectl

          # Start Docker and add ec2-user to the docker group
          systemctl start docker
          systemctl enable docker
          usermod -aG docker ec2-user

          # Install Jenkins
          wget -O /etc/yum.repos.d/jenkins.repo https://pkg.jenkins.io/redhat-stable/jenkins.repo
          rpm --import https://pkg.jenkins.io/redhat-stable/jenkins.io.key
          yum install -y jenkins
          systemctl enable jenkins
          systemctl start jenkins

          # Install AWS CLI
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          ./aws/install
          rm -rf awscliv2*

          # Configure AWS credentials (if needed)
          aws configure set region us-west-2
          aws configure set aws_access_key_id YOUR_ACCESS_KEY
          aws configure set aws_secret_access_key YOUR_SECRET_KEY

          # Download kubeconfig
          aws eks update-kubeconfig --name my-cluster --region us-west-2

          # Save the initial admin password for Jenkins
          cat /var/lib/jenkins/secrets/initialAdminPassword > /home/ec2-user/jenkins-admin-password.txt

          echo "Setup complete" > /home/ec2-user/setup-complete.log

      Tags:
        - Key: Name
          Value: "JenkinsInstance"

Outputs:
  JenkinsInstanceId:
    Description: "The ID of the Jenkins EC2 instance"
    Value: !Ref JenkinsInstance

  JenkinsPublicIp:
    Description: "The public IP address of the Jenkins EC2 instance"
    Value: !GetAtt JenkinsInstance.PublicIp

  JenkinsURL:
    Description: "URL to access Jenkins"
    Value: !Sub "http://${JenkinsInstance.PublicIp}:8080"