apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-db
  namespace: myapps
  labels:
    app: my-app-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app-db
  template:
    metadata:
      labels:
        app: my-app-db
    spec:
      serviceAccountName: db-sa
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        - name: MYSQL_DATABASE
          value: "testdb"
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-server-certs
          mountPath: /etc/mysql/certs
          readOnly: true
        - name: mysql-config
          mountPath: /etc/mysql/conf.d
          readOnly: true
        readinessProbe:
          exec:
            command:
            - "mysqladmin"
            - "ping"
            - "-h"
            - "127.0.0.1"
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - "mysqladmin"
            - "ping"
            - "-h"
            - "127.0.0.1"
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1"
        securityContext:
          runAsUser: 999
          runAsNonRoot: true
      volumes:
      - name: mysql-server-certs
        secret:
          secretName: mysql-server-certs
      - name: mysql-config
        configMap:
          name: mysql-config
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-db-service
  namespace: myapps
spec:
  selector:
    app: my-app-db
  ports:
    - port: 3306
      targetPort: 3306